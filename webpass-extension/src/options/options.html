<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebPass Extension Settings</title>
<style>
:root {
  --bg: #1a1a2e; --bg-card: #16213e; --bg-input: #0f3460;
  --accent: #6366f1; --accent-hover: #818cf8;
  --text: #e2e8f0; --text-muted: #94a3b8; --success: #22c55e; --border: #334155; --radius: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px;
  padding: 24px; max-width: 640px; margin: 0 auto; min-height: 100vh;
}
h1 { font-size: 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
.card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); }
label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px; font-weight: 500; }
textarea, input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-input); color: var(--text); font-size: 13px; outline: none; font-family: inherit;
}
textarea:focus, input:focus { border-color: var(--accent); }
textarea { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; resize: vertical; }
.btn-primary {
  padding: 10px 20px; border: none; border-radius: var(--radius);
  background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
}
.btn-primary:hover { background: var(--accent-hover); }
.success { color: var(--success); font-size: 13px; margin-top: 8px; }
.help { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }
code { background: var(--bg-input); padding: 1px 4px; border-radius: 3px; font-size: 11px; }
</style>
</head>
<body>
<h1>🔒 WebPass Settings</h1>

<div class="card">
  <label>PGP Private Key (armored)</label>
  <textarea id="privateKey" rows="12" placeholder="-----BEGIN PGP PRIVATE KEY BLOCK-----"></textarea>
  <p class="help">
    <strong>How to get your key:</strong><br>
    1. Open the WebPass webapp in your browser<br>
    2. Open DevTools → Application → IndexedDB → <code>webpass</code> → <code>keys</code><br>
    3. Find your fingerprint entry, copy the <code>privateKey</code> value<br>
    4. Paste it above
  </p>
  <p class="help">
    Or export from the WebPass webapp's Account section if available.
  </p>
</div>

<div class="card">
  <label>Server URL</label>
  <input type="url" id="serverUrl" placeholder="https://webpass.example.com" />
</div>

<div class="card">
  <label>Fingerprint</label>
  <input type="text" id="fingerprint" placeholder="ABCD1234..." style="text-transform:uppercase;font-family:monospace;" />
</div>

<button id="saveBtn" class="btn-primary">Save Settings</button>
<p id="status" class="success" style="display:none;">✓ Saved</p>

<script type="module" src="options.js"></script>
</body>
</html>
