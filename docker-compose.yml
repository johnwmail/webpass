services:
  webpass:
    image: ghcr.io/johnwmail/webpass:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-vdev-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        COMMIT: ${COMMIT:-unknown}
        FRONTEND_VERSION: ${FRONTEND_VERSION:-vdev-unknown}
        FRONTEND_BUILD_TIME: ${FRONTEND_BUILD_TIME:-unknown}
        FRONTEND_COMMIT: ${FRONTEND_COMMIT:-unknown}
    environment:
      # Frontend build metadata (passed to container for /api/version endpoint)
      - VERSION=${VERSION:-vdev-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
      - COMMIT=${COMMIT:-unknown}
      # Runtime configuration
      # Required: generate with `openssl rand -hex 32`. The container refuses
      # to start with an unset, short, or placeholder value.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to at least 32 random bytes (openssl rand -hex 32)}
      - DB_PATH=/data/db/db.sqlite3
      - GIT_REPO_ROOT=/data/git-repos
      # Cross-origin access is denied unless explicitly listed.
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Only set when running behind a reverse proxy (comma-separated IPs/CIDRs).
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-}
      # Browser PGP key auto-lock after inactivity (seconds, default 30).
      - PGP_KEY_TIMEOUT_SECONDS=${PGP_KEY_TIMEOUT_SECONDS:-30}
      # Optional: encrypts TOTP secrets at rest. If unset, a key file is
      # generated under /data (back it up with the database).
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:-}
      # Optional passkeys (WebAuthn). Leave WEBAUTHN_RP_ID unset to disable.
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-WebPass}
      - WEBAUTHN_RP_ORIGINS=${WEBAUTHN_RP_ORIGINS:-}
      # Allow git sync to self-hosted remotes on private/LAN addresses.
      - GIT_ALLOW_PRIVATE_NETWORKS=${GIT_ALLOW_PRIVATE_NETWORKS:-false}
      # Registration protection mode (TOTP-based)
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-false}
      - REGISTRATION_TOTP_SECRET=${REGISTRATION_TOTP_SECRET:-}
      - REGISTRATION_TOTP_PERIOD=${REGISTRATION_TOTP_PERIOD:-3600}
      - REGISTRATION_TOTP_ALGO=${REGISTRATION_TOTP_ALGO:-SHA1}
      - REGISTRATION_CODE_FILE=/data/registration_code.txt
    container_name: webpass
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - webpass-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - webpass-network

volumes:
  webpass-data:
    driver: local

networks:
  webpass-network:
    driver: bridge
