name: Build OpenBSD Binary

on:
  push:
    tags:
      - "v*"
    paths-ignore:
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-openbsd:
    name: Build openbsd (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: openbsd
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build \
            -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.Commit=${{ github.sha }}" \
            -o webpass-server-openbsd-${{ matrix.goarch }} \
            ./cmd/srv

      - name: Verify binary
        run: |
          file webpass-server-openbsd-${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: webpass-server-openbsd-${{ matrix.goarch }}
          path: webpass-server-openbsd-${{ matrix.goarch }}
          retention-days: 30
