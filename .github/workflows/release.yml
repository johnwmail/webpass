name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Build binaries
        env:
          CGO_ENABLED: '0'
        run: |
          set -e
          for target in linux/amd64 linux/arm64 openbsd/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "Building ${os}/${arch}"
            GOOS="${os}" GOARCH="${arch}" go build \
              -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.Commit=${{ github.sha }}" \
              -o "webpass-server-${os}-${arch}" \
              ./cmd/srv
          done
          echo "Built:"
          ls -lh webpass-server-*

      - name: Verify binaries
        run: file webpass-server-*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webpass-server-binaries
          path: webpass-server-*
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" webpass-server-* --clobber
          else
            gh release create "${TAG}" webpass-server-* \
              --title "${TAG}" \
              --generate-notes
          fi
