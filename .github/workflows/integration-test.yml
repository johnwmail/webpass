name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =============================================================================
  # Comprehensive Test Suite - Matches local ./playwright-e2e-test.sh
  # Phase 1: All tests (except registration) in Protected mode
  # Phase 2: Registration tests in Open mode
  # Phase 3: Registration tests in Protected mode
  # Phase 4: Registration tests in Disabled mode
  # =============================================================================
  integration-test:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Go dependencies
        run: go mod download

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      # Hermetic Git remote for git-sync E2E tests. go-git supports the
      # file:// transport, so no external Gitea/GitHub server or PAT is
      # needed. go-git initialises new repos on the "master" branch, so make
      # the bare repo HEAD point there.
      - name: Create local Git test repository
        run: |
          rm -rf /tmp/webpass-git-sync-test.git
          git init --bare /tmp/webpass-git-sync-test.git
          git -C /tmp/webpass-git-sync-test.git symbolic-ref HEAD refs/heads/master

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      # =============================================================================
      # Phase 0: Rate limit tests with DEFAULT limits (5 attempts / 15 min)
      # =============================================================================
      - name: Phase 0 - Rate Limit Tests (Default Limits)
        run: cd frontend && npx playwright test tests/e2e/ratelimit.spec.ts
        env:
          TEST_BASE_URL: http://localhost:18080
          JWT_SECRET: "test-secret-key-32-bytes-long!!!"
          DB_PATH: /tmp/webpass-test-ratelimit.db
          STATIC_DIR: frontend/dist
          DISABLE_FRONTEND: false
          GIT_REPO_ROOT: /tmp/git-repos
          REGISTRATION_ENABLED: true
          REGISTRATION_TOTP_SECRET: "JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP"
          REGISTRATION_TOTP_PERIOD: 3600
          REGISTRATION_TOTP_ALGO: SHA1
          # Use DEFAULT rate limits for rate limit tests
          WEBPASS_REPO_URL: file:///tmp/webpass-git-sync-test.git
          WEBPASS_REPO_PAT: ci-dummy-token
          # Allow the hermetic file:// remote used by git-sync E2E tests
          GIT_ALLOW_LOCAL_REPOS: true

      # =============================================================================
      # Phase 1: All tests EXCEPT registration and rate limit in Protected mode
      # =============================================================================
      - name: Phase 1 - All Tests (Protected Mode, No Registration)
        run: cd frontend && npx playwright test --grep-invert "Registration|Rate Limiting"
        env:
          TEST_BASE_URL: http://localhost:18080
          JWT_SECRET: "test-secret-key-32-bytes-long!!!"
          DB_PATH: /tmp/webpass-test-protected.db
          STATIC_DIR: frontend/dist
          DISABLE_FRONTEND: false
          GIT_REPO_ROOT: /tmp/git-repos
          REGISTRATION_ENABLED: true
          REGISTRATION_TOTP_SECRET: "JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP"
          REGISTRATION_TOTP_PERIOD: 3600
          REGISTRATION_TOTP_ALGO: SHA1
          # Relaxed rate limits for E2E tests to prevent false failures
          RATE_LIMIT_ATTEMPTS: 100
          RATE_LIMIT_WINDOW_MINUTES: 1
          WEBPASS_REPO_URL: file:///tmp/webpass-git-sync-test.git
          WEBPASS_REPO_PAT: ci-dummy-token
          # Allow the hermetic file:// remote used by git-sync E2E tests
          GIT_ALLOW_LOCAL_REPOS: true

      # =============================================================================
      # Phase 2: Registration tests in Open mode (server restarts with new config)
      # =============================================================================
      - name: Phase 2 - Registration Tests (Open Mode)
        run: |
          # Kill server to force restart with new env vars
          pkill -9 -f "webpass-server" 2>/dev/null || true
          pkill -9 -f "srv/main.go" 2>/dev/null || true
          sleep 3
          cd frontend && npx playwright test tests/e2e/registration-open.spec.ts
        env:
          TEST_BASE_URL: http://localhost:18080
          JWT_SECRET: "test-secret-key-32-bytes-long!!!"
          DB_PATH: /tmp/webpass-test-open.db
          STATIC_DIR: frontend/dist
          DISABLE_FRONTEND: false
          GIT_REPO_ROOT: /tmp/git-repos
          REGISTRATION_ENABLED: true
          REGISTRATION_TOTP_SECRET: ""
          # Relaxed rate limits for E2E tests to prevent false failures
          RATE_LIMIT_ATTEMPTS: 100
          RATE_LIMIT_WINDOW_MINUTES: 1
          WEBPASS_REPO_URL: file:///tmp/webpass-git-sync-test.git
          WEBPASS_REPO_PAT: ci-dummy-token
          # Allow the hermetic file:// remote used by git-sync E2E tests
          GIT_ALLOW_LOCAL_REPOS: true

      # =============================================================================
      # Phase 3: Registration tests in Protected mode (server restarts)
      # =============================================================================
      - name: Phase 3 - Registration Tests (Protected Mode)
        run: |
          # Kill server to force restart with new env vars
          pkill -9 -f "webpass-server" 2>/dev/null || true
          pkill -9 -f "srv/main.go" 2>/dev/null || true
          sleep 3
          cd frontend && npx playwright test tests/e2e/registration-protected.spec.ts
        env:
          TEST_BASE_URL: http://localhost:18080
          JWT_SECRET: "test-secret-key-32-bytes-long!!!"
          DB_PATH: /tmp/webpass-test-protected2.db
          STATIC_DIR: frontend/dist
          DISABLE_FRONTEND: false
          GIT_REPO_ROOT: /tmp/git-repos
          REGISTRATION_ENABLED: true
          REGISTRATION_TOTP_SECRET: "JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP"
          REGISTRATION_TOTP_PERIOD: 3600
          REGISTRATION_TOTP_ALGO: SHA1
          # Relaxed rate limits for E2E tests to prevent false failures
          RATE_LIMIT_ATTEMPTS: 100
          RATE_LIMIT_WINDOW_MINUTES: 1
          WEBPASS_REPO_URL: file:///tmp/webpass-git-sync-test.git
          WEBPASS_REPO_PAT: ci-dummy-token
          # Allow the hermetic file:// remote used by git-sync E2E tests
          GIT_ALLOW_LOCAL_REPOS: true

      # =============================================================================
      # Phase 4: Registration tests in Disabled mode (server restarts)
      # =============================================================================
      - name: Phase 4 - Registration Tests (Disabled Mode)
        run: |
          # Kill server to force restart with new env vars
          pkill -9 -f "webpass-server" 2>/dev/null || true
          pkill -9 -f "srv/main.go" 2>/dev/null || true
          sleep 3
          cd frontend && npx playwright test tests/e2e/registration-disabled.spec.ts
        env:
          TEST_BASE_URL: http://localhost:18080
          JWT_SECRET: "test-secret-key-32-bytes-long!!!"
          DB_PATH: /tmp/webpass-test-disabled.db
          STATIC_DIR: frontend/dist
          DISABLE_FRONTEND: false
          GIT_REPO_ROOT: /tmp/git-repos
          REGISTRATION_ENABLED: false
          REGISTRATION_TOTP_SECRET: ""
          # Relaxed rate limits for E2E tests to prevent false failures
          RATE_LIMIT_ATTEMPTS: 100
          RATE_LIMIT_WINDOW_MINUTES: 1
          WEBPASS_REPO_URL: file:///tmp/webpass-git-sync-test.git
          WEBPASS_REPO_PAT: ci-dummy-token
          # Allow the hermetic file:// remote used by git-sync E2E tests
          GIT_ALLOW_LOCAL_REPOS: true

      - name: Upload test results (HTML report)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results (screenshots/videos)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload test results (JSON)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-json-results
          path: frontend/test-results/results.json
          retention-days: 7
