name: Scripts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-scripts:
    name: CLI scripts E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true

      - name: Syntax check
        run: bash -n scripts/create-account.sh scripts/import-passstore.sh scripts/test-scripts.sh

      - name: Check tools
        run: |
          for c in curl gpg jq tar find; do
            command -v "$c" >/dev/null 2>&1 || { echo "missing required tool: $c"; exit 1; }
          done

      - name: Run E2E
        run: bash scripts/test-scripts.sh
