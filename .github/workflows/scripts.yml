name: Scripts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-scripts:
    name: CLI scripts E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true

      - name: Syntax check
        run: bash -n scripts/create-account.sh scripts/import-passstore.sh scripts/test-scripts.sh scripts/download-latest.sh

      - name: Check tools
        run: |
          for c in curl gpg jq tar find; do
            command -v "$c" >/dev/null 2>&1 || { echo "missing required tool: $c"; exit 1; }
          done

      - name: Run E2E
        run: bash scripts/test-scripts.sh

      - name: Test download-latest.sh
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          port=18093
          python3 -m http.server "$port" --bind 127.0.0.1 --directory "$work/releases" \
            >/dev/null 2>&1 &
          http_pid=$!
          trap 'kill "$http_pid" 2>/dev/null || true; rm -rf "$work"' EXIT

          asset="$work/releases/download/v9.9.9/webpass-server-linux-amd64"
          mkdir -p "$(dirname "$asset")"
          printf '#!/bin/sh\necho fake-binary\n' >"$asset"
          chmod +x "$asset"
          (cd "$(dirname "$asset")" && sha256sum webpass-server-linux-amd64 >SHA256SUMS)

          sleep 1
          base="http://127.0.0.1:${port}"
          WEBPASS_RELEASES="$base" scripts/download-latest.sh \
            --version v9.9.9 --os linux --arch amd64 -o "$work/out"
          test -x "$work/out"
          grep -q 'fake-binary' "$work/out"

          # A mismatched checksum must fail and must not leave a binary behind.
          printf '%064d  webpass-server-linux-amd64\n' 0 >"$(dirname "$asset")/SHA256SUMS"
          if WEBPASS_RELEASES="$base" scripts/download-latest.sh \
            --version v9.9.9 --os linux --arch amd64 -o "$work/bad"; then
            echo "corrupted checksum was accepted" >&2
            exit 1
          fi
          test ! -e "$work/bad"
