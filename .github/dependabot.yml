version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      # Batch minor/patch updates; major updates stay as individual PRs.
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      frontend-production:
        dependency-type: production
        patterns: ["*"]
        update-types: ["minor", "patch"]
      frontend-development:
        dependency-type: development
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      docker:
        patterns: ["*"]
    # Stay on the pinned Go 1.26 and Node 24 lines. Patch releases are still
    # allowed; only the next minor/major bump is blocked (Go 1.27, Node 25).
    ignore:
      - dependency-name: "golang"
        update-types: ["minor", "major"]
      - dependency-name: "node"
        update-types: ["major"]
